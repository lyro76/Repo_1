name: CI

on:
  push:
    branches: ["video-arms"]
  pull_request:

jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests du moteur (sans torch, moteur factice)
        run: |
          python -m pip install -e "engine[dev]"
          python -m pytest engine -q
  shell:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Interface
        run: npm ci --prefix ui && npm run build --prefix ui

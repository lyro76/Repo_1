# Construit les installateurs et les publie dans une Release GitHub « vX.Y.Z ».
# Déclenchement : changer "version" dans src-tauri/tauri.conf.json et pousser sur
# la branche digital-arms (ou lancer le workflow à la main depuis l'onglet Actions).
# Le tag est créé par tauri-action à partir de la version.
name: Release

on:
  push:
    branches: ["digital-arms"]
    paths:
      - "src-tauri/tauri.conf.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dépendances de l'interface
        run: npm ci --prefix ui

      - name: CLI Tauri
        run: npm install -g @tauri-apps/cli@2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: tauri
          tagName: v__VERSION__
          releaseName: Digital Arms v__VERSION__
          releaseBody: |
            Installateurs de Digital Arms.

            - **Windows** : `Digital.Arms_*_x64-setup.exe` (ou le `.msi`)
            - **Linux** : `.deb` ou `.AppImage`
            - **macOS** : `.dmg` (application non signée : clic droit → Ouvrir la première fois)

            Il faut aussi un modèle local, par exemple avec Ollama : `ollama pull qwen2.5-coder:14b`.
          releaseDraft: false
          prerelease: false

[workspace]
resolver = "2"
members = ["crates/da-core", "crates/da-cli", "src-tauri"]
# src-tauri a besoin de webkit2gtk : on ne le compile que sur demande (`cargo tauri dev`).
default-members = ["crates/da-core", "crates/da-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
da-core = { path = "crates/da-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "fs", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
regex = "1"
ignore = "0.4"
similar = "2"
tracing = "0.1"

<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f1620" />
  <title>Esprit Clair</title>
  <link rel="icon" href="./icon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;700;800&family=Nunito+Sans:wght@400;600&display=swap" />
</head>
<body>
  <div id="app">
    <header class="top"><h1>Esprit Clair</h1><span id="streak" class="pill"></span></header>
    <main id="view"></main>
    <nav class="tabs" id="tabs">
      <button data-tab="today" class="on"><span>◎</span>Aujourd'hui</button>
      <button data-tab="exercises"><span>▦</span>Exercices</button>
      <button data-tab="brain"><span>◍</span>Cerveau</button>
      <button data-tab="stats"><span>▥</span>Statistiques</button>
      <button data-tab="journal"><span>✎</span>Journal</button>
    </nav>
  </div>
  <div id="session" class="session" hidden>
    <div class="session-top"><button id="s-quit" class="ghost">✕</button><div id="s-title"></div><div id="s-time"></div></div>
    <div class="session-bar"><div id="s-progress"></div></div>
    <div id="s-status" class="s-status"></div>
    <div id="s-box" class="s-box"><canvas id="s-canvas"></canvas></div>
    <div id="s-hint" class="s-hint"></div>
    <div id="s-result" class="s-result" hidden></div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
